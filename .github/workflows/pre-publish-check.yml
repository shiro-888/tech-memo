name: Pre-publish Checks

# main 向けの PR で公開前ガードレールを自動実行する。
# このジョブ名 (guardrails) はフェーズ4のブランチ保護で必須チェックに指定する。
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA 固定（サプライチェーン対策）。バージョンは末尾コメント / Dependabot が更新。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks が PR の差分（コミット範囲）を走査できるよう全履歴を取得する
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata consistency (index cards vs article heads)
        # index.html のカードは記事 <head> の article:* を手作業でコピーしたもの。
        # 公開済み記事を直したときにカード側が取り残されるのを防ぐ。
        # ubuntu-latest には Python3 が同梱なので setup-python は不要。
        run: python3 tools/check_consistency.py

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 公開対象の HTML 内リンク切れを検出する
          args: --no-progress './**/*.html'
          fail: true
