# lychee（CI の guardrails ジョブのリンク切れチェック）の設定。
# lychee は作業ディレクトリの lychee.toml を自動で読むので、CI でも手元でも同じ条件になる。
# 個別に除外する URL は .lycheeignore に書く。
#
# 背景: 外部サイトが GitHub Actions の共有 IP に対して一時的に 503 を返したり、
# 応答しなかったりして、リンクは生きているのに CI が赤くなる事象が続いた。
# 実行のたびに失敗する URL が入れ替わるため（bleepingcomputer.com、github.com、
# tanstack.com で確認）、1 件ずつ除外するのではなく、ここで一括して扱いを決める。
#
# 方針: 「リンク先が存在しない」ことが分かる結果（404、410、名前解決の失敗など）は
# 従来どおり失敗にする。「今は確認できなかった」だけの結果は失敗にしない。

# 受け入れるステータスコード。lychee の既定値（100〜103 と 200〜299）に 2 つ足している。
#   429: レート制限。サイトが生きていることの裏返し。
#   503: 一時的な利用不可。lychee は 503 を再試行しないため、1 回返っただけで CI が失敗していた。
# 403 は足さない。bot 判定による 403 は、リンクを参考リストから外すか
# .lycheeignore に理由つきで除外する、というこれまでの運用を保つ。
accept = ["100..=103", "200..=299", "429", "503"]

# 応答がなかっただけではリンク切れかどうか分からないので、タイムアウトは失敗にしない。
accept_timeouts = true
